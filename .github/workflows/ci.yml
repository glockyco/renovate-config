name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The OpenSpec artifacts are repository content, and nothing verified them
  # until now. The check is defined once for the whole workstation in the fleet
  # input: it fails on an invalid artifact and on a change archived with
  # unfinished tasks.
  openspec:
    name: OpenSpec artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Validate OpenSpec artifacts
        run: nix build --no-link ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).openspec"

  # Every consuming repository inherits default.json, so an invalid preset breaks
  # their updates. The flake check runs Renovate's own validator on it.
  renovate:
    name: Renovate preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Validate the Renovate preset
        run: nix build --no-link ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).renovate"
